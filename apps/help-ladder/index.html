<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ask 3 Before Me</title>
  <!-- No shared navbar/branding here on purpose: students land on this
       page directly via a link/QR code their teacher gives them, and
       should never see (or be able to navigate to) the rest of the
       teacher-facing toolkit. Only theme.css (CSS variables) is kept. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;600;700&family=Ubuntu:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../shell/theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--tk-bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      font-size: 1.4rem;
      color: var(--tk-text);
      margin: 12px 0 20px;
    }

    /* Join-by-code screen (shown if no ?session= in the URL, or an unknown code) */
    #joinScreen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
    }
    #joinScreen p { color: var(--tk-text-muted); }
    #joinScreen input {
      font-size: 1.6rem;
      letter-spacing: 0.15em;
      text-align: center;
      text-transform: uppercase;
      padding: 14px 18px;
      border: 2px solid #ddd;
      border-radius: 12px;
      width: 220px;
    }
    #joinScreen button {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      background: var(--tk-primary);
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      cursor: pointer;
    }
    #errorMsg { color: #dc3545; font-size: 0.9rem; min-height: 1.2em; }

    /* Checklist screen */
    #checklistScreen { display: none; flex: 1; flex-direction: column; }
    #checklistScreen .lead {
      text-align: center;
      color: var(--tk-text-muted);
      margin-bottom: 18px;
      font-size: 0.95rem;
    }
    .checklist {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .checklist-item {
      background: var(--tk-surface);
      box-shadow: var(--tk-shadow);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--tk-text);
      line-height: 1.35;
    }
    #stuckBtn {
      margin-top: auto;
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
      background: var(--tk-primary);
      border: none;
      border-radius: 16px;
      padding: 20px;
      cursor: pointer;
    }
    #stuckBtn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Confirmation screen */
    #confirmScreen {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 14px;
    }
    #confirmScreen .wave { font-size: 3.4rem; }
    #confirmScreen h2 { font-size: 1.3rem; color: var(--tk-text); }
    #confirmScreen p { color: var(--tk-text-muted); font-size: 0.95rem; max-width: 320px; }
    #cancelBtn {
      margin-top: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--tk-primary-dark);
      background: #e0e7ff;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      cursor: pointer;
    }
    #cancelBtn:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <main>
    <h1>🙋 Ask 3 Before Me</h1>

    <div id="joinScreen">
      <p>Enter the code your teacher gave you:</p>
      <input type="text" id="codeInput" maxlength="5" placeholder="ABCDE" autocomplete="off">
      <div id="errorMsg"></div>
      <button id="joinBtn" type="button">Join</button>
    </div>

    <div id="checklistScreen">
      <p class="lead">Have you tried all of these first?</p>
      <div class="checklist" id="checklistItems"></div>
      <button id="stuckBtn" type="button">🙋 I'm still stuck</button>
    </div>

    <div id="confirmScreen">
      <div class="wave">✋</div>
      <h2>Signal sent</h2>
      <p>Sit tight — your teacher's on the way.</p>
      <button id="cancelBtn" type="button">Cancel signal — I figured it out</button>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
  <script src="../shell/firebase-config.js"></script>
  <script src="../shell/toast.js"></script>
  <script src="help-ladder.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    let sessionId = (params.get('session') || '').toUpperCase();

    const joinScreen = document.getElementById('joinScreen');
    const checklistScreen = document.getElementById('checklistScreen');
    const confirmScreen = document.getElementById('confirmScreen');
    const errorMsg = document.getElementById('errorMsg');
    const stuckBtn = document.getElementById('stuckBtn');
    const cancelBtn = document.getElementById('cancelBtn');

    function signaledKey(id) { return 'tk-help-ladder-signaled-' + id; }
    function studentIdKey(id) { return 'tk-help-ladder-studentid-' + id; }

    let studentId = null;
    let currentSteps = TKHelpLadder.DEFAULT_STEPS.slice();

    function showScreen(el) {
      joinScreen.style.display = 'none';
      checklistScreen.style.display = 'none';
      confirmScreen.style.display = 'none';
      el.style.display = 'flex';
    }

    function renderChecklist() {
      const wrap = document.getElementById('checklistItems');
      wrap.innerHTML = '';
      currentSteps.forEach(text => {
        const item = document.createElement('div');
        item.className = 'checklist-item';
        item.textContent = text;
        wrap.appendChild(item);
      });
    }

    function loadSessionAndShow(id) {
      const joinBtn = document.getElementById('joinBtn');
      joinBtn.disabled = true;

      // Without this, a bad connection/config leaves this read pending
      // indefinitely (Firestore's own retry/backoff can run far longer than
      // 8s) and the student is stuck on a blank/unresponsive join screen
      // with no feedback — same failure mode guarded against everywhere
      // else writes/reads happen in this tool.
      let settled = false;
      const timeoutId = setTimeout(() => {
        if (settled) return;
        settled = true;
        joinBtn.disabled = false;
        errorMsg.textContent = 'Could not load this session — check your connection and try again.';
        showScreen(joinScreen);
      }, 8000);

      TKHelpLadder.sessionDocRef(id).get().then(doc => {
        if (settled) return;
        settled = true;
        clearTimeout(timeoutId);
        joinBtn.disabled = false;

        if (!doc.exists) {
          errorMsg.textContent = 'That code was not found — double-check with your teacher.';
          showScreen(joinScreen);
          return;
        }

        const data = doc.data() || {};
        currentSteps = [data.step1, data.step2, data.step3, data.step4, data.step5]
          .map((s, i) => (typeof s === 'string' && s.trim()) ? s : TKHelpLadder.DEFAULT_STEPS[i]);

        studentId = localStorage.getItem(studentIdKey(id));
        if (!studentId) {
          studentId = TKHelpLadder.randomStudentId();
          localStorage.setItem(studentIdKey(id), studentId);
        }

        if (localStorage.getItem(signaledKey(id))) {
          showScreen(confirmScreen);
        } else {
          renderChecklist();
          showScreen(checklistScreen);
        }
      }).catch(err => {
        if (settled) return;
        settled = true;
        clearTimeout(timeoutId);
        joinBtn.disabled = false;
        console.error(err);
        errorMsg.textContent = 'Could not load this session — check your connection and try again.';
        showScreen(joinScreen);
      });
    }

    document.getElementById('joinBtn').onclick = () => {
      const code = document.getElementById('codeInput').value.trim().toUpperCase();
      if (code.length !== 5) {
        errorMsg.textContent = "Enter the 5-letter code your teacher gave you.";
        return;
      }
      errorMsg.textContent = '';
      sessionId = code;
      const url = new URL(location.href);
      url.searchParams.set('session', sessionId);
      history.replaceState(null, '', url);
      loadSessionAndShow(sessionId);
    };

    stuckBtn.onclick = () => {
      stuckBtn.disabled = true;

      // Without this, a bad connection or misconfigured Firebase project
      // leaves the write pending forever with zero feedback — time it out.
      let settled = false;
      const timeoutId = setTimeout(() => {
        if (settled) return;
        settled = true;
        stuckBtn.disabled = false;
        TKToast.show('Could not send your signal — check your connection and try again.');
      }, 8000);

      TKHelpLadder.signalDocRef(sessionId, studentId).set({
        joinedAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        if (settled) return;
        settled = true;
        clearTimeout(timeoutId);
        stuckBtn.disabled = false;
        localStorage.setItem(signaledKey(sessionId), '1');
        showScreen(confirmScreen);
      }).catch(err => {
        if (settled) return;
        settled = true;
        clearTimeout(timeoutId);
        console.error(err);
        stuckBtn.disabled = false;
        TKToast.show('Could not send your signal — check your connection and try again.');
      });
    };

    cancelBtn.onclick = () => {
      cancelBtn.disabled = true;

      let settled = false;
      const timeoutId = setTimeout(() => {
        if (settled) return;
        settled = true;
        cancelBtn.disabled = false;
        TKToast.show('Could not cancel your signal — check your connection and try again.');
      }, 8000);

      TKHelpLadder.signalDocRef(sessionId, studentId).delete().then(() => {
        if (settled) return;
        settled = true;
        clearTimeout(timeoutId);
        cancelBtn.disabled = false;
        localStorage.removeItem(signaledKey(sessionId));
        renderChecklist();
        showScreen(checklistScreen);
      }).catch(err => {
        if (settled) return;
        settled = true;
        clearTimeout(timeoutId);
        console.error(err);
        cancelBtn.disabled = false;
        TKToast.show('Could not cancel your signal — check your connection and try again.');
      });
    };

    if (sessionId) {
      loadSessionAndShow(sessionId);
    }
  </script>
</body>
</html>

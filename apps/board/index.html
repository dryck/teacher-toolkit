<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Board | Teacher Toolkit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;600;700&family=Ubuntu:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../shell/theme.css">
  <link rel="stylesheet" href="../shell/navbar.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--tk-bg-gradient);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .board-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      flex-wrap: wrap;
    }
    .board-bar .spacer { flex: 1; }
    .board-bar .hint {
      font-size: 0.82rem;
      color: var(--tk-text-muted);
    }
    .board-bar button {
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 30px;
      border: 1.5px solid var(--tk-primary);
      background: transparent;
      color: var(--tk-primary);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .board-bar button:hover { background: var(--tk-primary); color: #fff; }
    .board-bar button.primary { background: var(--tk-primary); color: #fff; }
    .board-bar button.primary:hover { background: var(--tk-primary-dark); }

    /* ---- canvas ---- */
    #canvas {
      position: relative;
      flex: 1;
      min-height: 0;
      margin: 0 10px 10px;
    }

    .pane {
      position: absolute;
      display: flex;
      flex-direction: column;
      background: var(--tk-surface);
      border-radius: var(--tk-radius);
      overflow: hidden;
      box-shadow: var(--tk-shadow);
    }
    .pane.dragging { box-shadow: 0 20px 48px rgba(38, 87, 135, 0.35); }

    .pane-head {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      background: rgba(38, 87, 135, 0.07);
      border-bottom: 1px solid rgba(38, 87, 135, 0.12);
      cursor: grab;
      touch-action: none;
    }
    .pane-head:active { cursor: grabbing; }
    .pane-title {
      font-family: var(--tk-font-heading);
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--tk-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      user-select: none;
    }
    .pane-head button {
      font: inherit;
      font-size: 0.9rem;
      line-height: 1;
      border: none;
      background: transparent;
      color: var(--tk-primary);
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
    }
    .pane-head button:hover { background: rgba(38, 87, 135, 0.14); }

    /* The tool renders at a fixed logical width and is scaled to fit the
       pane, so a smaller pane shows the whole tool shrunk rather than a
       clipped corner of it. */
    .pane-body { position: relative; flex: 1; overflow: hidden; }
    .pane-body iframe {
      position: absolute;
      top: 0; left: 0;
      border: 0;
      transform-origin: 0 0;
    }

    .pane-resize {
      position: absolute;
      right: 0; bottom: 0;
      width: 20px; height: 20px;
      cursor: nwse-resize;
      touch-action: none;
      background:
        linear-gradient(135deg, transparent 50%, rgba(38,87,135,0.35) 50%);
      border-bottom-right-radius: var(--tk-radius);
    }

    /* Covers every iframe while dragging so the panes, not the embedded
       tools, receive the pointer events. Without it a drag dies the moment
       the cursor crosses another tool. */
    #shield {
      position: fixed;
      inset: 0;
      z-index: 400;
      display: none;
      cursor: grabbing;
    }
    #shield.on { display: block; }

    .empty {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--tk-text-muted);
      text-align: center;
      padding: 30px;
    }
    .empty h2 { font-size: 1.4rem; color: var(--tk-text); }
    .empty p { max-width: 440px; line-height: 1.5; }

    .detached {
      display: none;
      position: absolute;
      inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      padding: 30px;
      color: var(--tk-text-muted);
    }
    .detached.on { display: flex; }
    .detached h2 { font-size: 1.4rem; color: var(--tk-text); }
    .detached p { max-width: 460px; line-height: 1.5; }
    .detached button {
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 9px 18px;
      border-radius: 30px;
      border: 1.5px solid var(--tk-primary);
      background: var(--tk-primary);
      color: #fff;
      cursor: pointer;
    }
    /* Popped-out window: the board is the whole point of it, so lose the
       controls that only make sense in a tab. */
    body.tk-popped #popBtn { display: none; }

    /* ---- picker ---- */
    .picker-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 30, 45, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 500;
    }
    .picker-backdrop.open { display: flex; }
    .picker {
      background: var(--tk-surface);
      border-radius: var(--tk-radius);
      box-shadow: var(--tk-shadow);
      padding: 18px;
      width: min(680px, 100%);
      max-height: 80vh;
      overflow-y: auto;
    }
    .picker h2 { font-size: 1.1rem; color: var(--tk-text); margin-bottom: 12px; }
    .picker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 8px;
    }
    .picker-grid button {
      font: inherit;
      text-align: left;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(38, 87, 135, 0.18);
      background: transparent;
      color: var(--tk-text);
      cursor: pointer;
    }
    .picker-grid button:hover { background: rgba(38, 87, 135, 0.08); }
    .picker-grid button[disabled] { opacity: 0.4; cursor: default; }
    .picker-grid button[disabled]:hover { background: transparent; }
  </style>
</head>
<body>
  <div class="board-bar">
    <button id="addBtn" class="primary">+ Add tool</button>
    <button id="tidyBtn">Tidy up</button>
    <button id="clearBtn">Clear board</button>
    <span class="spacer"></span>
    <span class="hint">Drag the title bar to move · drag the corner to resize</span>
    <button id="popBtn">⧉ Open in own window</button>
    <button id="fsBtn">⛶ Fullscreen</button>
  </div>

  <div id="canvas"></div>

  <!-- Shown in the original tab once the board has been popped out, so the
       tab is free for other things without two live copies of the tools
       fighting over the microphone and speakers. -->
  <div id="detached" class="detached">
    <h2>Board is open in its own window</h2>
    <p>This tab is free now — open anything you like in it. The board keeps
       running in the other window, so your timers and noise monitor carry on.</p>
    <button id="reclaimBtn" class="primary">Bring the board back here</button>
  </div>
  <div id="shield"></div>

  <div class="picker-backdrop" id="pickerBackdrop">
    <div class="picker">
      <h2>Add a tool to the board</h2>
      <div class="picker-grid" id="pickerGrid"></div>
    </div>
  </div>

  <script>window.TK_CURRENT = 'board';</script>
  <script src="../shell/navbar.js"></script>
  <script src="../shell/toast.js"></script>
  <script>
  (function () {
    var MAX_PANES = 6;
    var STORAGE_KEY = 'tk-lesson-board-v2';

    // The width every embedded tool is laid out at before being scaled to
    // fit its pane. Roughly the widest any tool's own container gets, so
    // the tool fills the pane rather than sitting in a lake of margin.
    var LOGICAL_W = 860;
    // Roughly a tool's natural full-page height. Panes shorter than this
    // scale the tool down rather than cropping the bottom off it.
    var LOGICAL_H = 760;
    var MIN_W = 0.14, MIN_H = 0.16;   // fractions of the canvas
    // Never scale a tool below this -- past it the pane scrolls instead.
    var MIN_SCALE = 0.32;

    var canvas = document.getElementById('canvas');
    var shield = document.getElementById('shield');
    var backdrop = document.getElementById('pickerBackdrop');
    var grid = document.getElementById('pickerGrid');

    var TOOLS = (window.TK_TOOLS || []).filter(function (t) {
      return !t.isBrand && t.key !== 'board' && t.key !== 'research';
    });

    // Geometry is stored as fractions of the canvas, not pixels, so a board
    // built on a laptop still makes sense projected at a different size.
    var panes = load();
    var zTop = 1;

    function load() {
      try {
        var raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        return raw
          .filter(function (p) { return TOOLS.some(function (t) { return t.key === p.key; }); })
          .slice(0, MAX_PANES)
          .map(function (p) {
            return {
              key: p.key,
              x: clamp(p.x, 0, 0.95), y: clamp(p.y, 0, 0.95),
              w: clamp(p.w, MIN_W, 1), h: clamp(p.h, MIN_H, 1)
            };
          });
      } catch (e) { return []; }
    }

    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(panes)); } catch (e) {}
    }

    function clamp(v, lo, hi) {
      v = typeof v === 'number' && isFinite(v) ? v : lo;
      return Math.min(hi, Math.max(lo, v));
    }

    function toolFor(key) {
      return TOOLS.filter(function (t) { return t.key === key; })[0];
    }

    function srcFor(tool) {
      return '../' + tool.href + (tool.href.indexOf('?') === -1 ? '?' : '&') + 'embed=1';
    }

    /* A fresh pane drops into the next quadrant so a new board looks tidy
       before anyone drags anything. */
    function defaultRect(i) {
      var slots = [
        { x: 0.01, y: 0.01, w: 0.48, h: 0.48 },
        { x: 0.51, y: 0.01, w: 0.48, h: 0.48 },
        { x: 0.01, y: 0.51, w: 0.48, h: 0.48 },
        { x: 0.51, y: 0.51, w: 0.48, h: 0.48 },
        { x: 0.26, y: 0.26, w: 0.48, h: 0.48 },
        { x: 0.16, y: 0.16, w: 0.48, h: 0.48 }
      ];
      return slots[i % slots.length];
    }

    /* ---------------- rendering ----------------
       Panes are created once and then only repositioned; rebuilding them
       would reload the iframes and stop anything running inside. */
    function render() {
      var emptyEl = canvas.querySelector('.empty');
      if (!panes.length) {
        Array.prototype.slice.call(canvas.querySelectorAll('.pane')).forEach(function (p) { p.remove(); });
        if (!emptyEl) {
          canvas.insertAdjacentHTML('beforeend',
            '<div class="empty"><h2>Your lesson board is empty</h2>' +
            '<p>Add the tools you want on screen together, then drag them where you want ' +
            'and size them to suit. Timers keep running even while you work in another tool.</p></div>');
        }
        return;
      }
      if (emptyEl) emptyEl.remove();

      var keys = panes.map(function (p) { return p.key; });
      Array.prototype.slice.call(canvas.querySelectorAll('.pane')).forEach(function (el) {
        if (keys.indexOf(el.dataset.key) === -1) el.remove();
      });

      panes.forEach(function (p) {
        var el = canvas.querySelector('.pane[data-key="' + p.key + '"]');
        if (!el) el = makePane(p);
        place(el, p);
      });
    }

    function place(el, p) {
      el.style.left = (p.x * 100) + '%';
      el.style.top = (p.y * 100) + '%';
      el.style.width = (p.w * 100) + '%';
      el.style.height = (p.h * 100) + '%';
      rescale(el);
    }

    /* Scale the embedded tool so the whole of it fits the pane. The iframe
       is laid out at a fixed logical size and then transform-scaled, which
       keeps the tool's own layout intact instead of squeezing it into a
       narrow column.

       Both axes matter: scaling on width alone leaves a tall tool taller
       than its pane and it clips, which is the exact problem this is meant
       to solve. Taking the smaller of the two ratios fits the whole tool
       and letterboxes whatever space is left over. */
    /* How tall the tool actually is, in its own layout pixels.

       A fixed guess doesn't work: Group Generator is short until you press
       Generate and then grows a whole results grid, so a one-size height
       either wastes space or cuts the results off -- which is exactly what
       it did. The panes are same-origin, so the real height is readable.

       The height is zeroed first because nearly every tool sets
       `min-height: 100vh` on its body, and 100vh inside an iframe means the
       iframe's own height. Measuring without that would just read back
       whatever height we last set, not the content. */
    function measureContent(frame) {
      try {
        var doc = frame.contentDocument;
        if (!doc || !doc.documentElement) return null;
        var prev = frame.style.height;
        frame.style.height = '0px';
        var natural = doc.documentElement.scrollHeight;
        frame.style.height = prev;
        return natural > 0 ? natural : null;
      } catch (e) {
        return null;   // cross-origin or not loaded yet
      }
    }

    function rescale(el) {
      var body = el.querySelector('.pane-body');
      var frame = el.querySelector('iframe');
      if (!body || !frame) return;
      var w = body.clientWidth, h = body.clientHeight;
      if (!w || !h) return;

      var logicalH = measureContent(frame) || LOGICAL_H;
      frame.dataset.lastH = String(logicalH);

      // Fit the whole tool, but never shrink it past legibility -- below the
      // floor the pane scrolls instead, which beats text nobody can read
      // from the back of a room.
      var scale = Math.min(w / LOGICAL_W, h / logicalH);
      scale = Math.max(scale, MIN_SCALE);

      frame.style.width = LOGICAL_W + 'px';
      frame.style.height = (h / scale) + 'px';
      var left = (w - LOGICAL_W * scale) / 2;
      frame.style.transform = 'translate(' + Math.max(0, left) + 'px,0) scale(' + scale + ')';
    }

    /* Re-fit when a tool's own content changes size -- generating groups,
       revealing a result, starting a circle. Guarded on the measured
       natural height so our own resize of the iframe can't feed back into
       an endless loop. */
    function watchContent(el, frame) {
      function check() {
        var natural = measureContent(frame);
        if (natural && natural !== Number(frame.dataset.lastH)) rescale(el);
      }
      frame.addEventListener('load', function () {
        rescale(el);
        try {
          var doc = frame.contentDocument;
          if (doc && doc.body && window.ResizeObserver) {
            new ResizeObserver(check).observe(doc.body);
          }
        } catch (e) { /* nothing to observe */ }
      });
    }

    function makePane(p) {
      var tool = toolFor(p.key);
      var el = document.createElement('div');
      el.className = 'pane';
      el.dataset.key = p.key;
      el.style.zIndex = String(++zTop);

      var head = document.createElement('div');
      head.className = 'pane-head';

      var title = document.createElement('span');
      title.className = 'pane-title';
      title.textContent = tool.label;

      var maxBtn = document.createElement('button');
      maxBtn.type = 'button';
      maxBtn.textContent = '⛶';
      maxBtn.title = 'Maximise / restore';
      maxBtn.setAttribute('aria-label', 'Maximise ' + tool.label);
      maxBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
      maxBtn.addEventListener('click', function () { toggleMax(p, el); });

      var closeBtn = document.createElement('button');
      closeBtn.type = 'button';
      closeBtn.textContent = '✕';
      closeBtn.title = 'Remove from board';
      closeBtn.setAttribute('aria-label', 'Remove ' + tool.label);
      closeBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
      closeBtn.addEventListener('click', function () {
        panes = panes.filter(function (q) { return q.key !== p.key; });
        save();
        render();
      });

      head.appendChild(title);
      head.appendChild(maxBtn);
      head.appendChild(closeBtn);

      var body = document.createElement('div');
      body.className = 'pane-body';
      var frame = document.createElement('iframe');
      frame.src = srcFor(tool);
      frame.setAttribute('allow', 'microphone; fullscreen; autoplay');
      frame.title = tool.label;
      body.appendChild(frame);
      watchContent(el, frame);

      var handle = document.createElement('div');
      handle.className = 'pane-resize';
      handle.title = 'Drag to resize';

      el.appendChild(head);
      el.appendChild(body);
      el.appendChild(handle);
      canvas.appendChild(el);

      el.addEventListener('pointerdown', function () { el.style.zIndex = String(++zTop); }, true);
      head.addEventListener('pointerdown', function (e) { startDrag(e, p, el, 'move'); });
      handle.addEventListener('pointerdown', function (e) { startDrag(e, p, el, 'resize'); });

      return el;
    }

    function toggleMax(p, el) {
      if (p.prev) {
        p.x = p.prev.x; p.y = p.prev.y; p.w = p.prev.w; p.h = p.prev.h;
        delete p.prev;
      } else {
        p.prev = { x: p.x, y: p.y, w: p.w, h: p.h };
        p.x = 0; p.y = 0; p.w = 1; p.h = 1;
        el.style.zIndex = String(++zTop);
      }
      place(el, p);
      save();
    }

    /* ---------------- drag + resize ---------------- */
    function startDrag(e, p, el, mode) {
      if (e.button !== undefined && e.button !== 0) return;
      e.preventDefault();

      var rect = canvas.getBoundingClientRect();
      var startX = e.clientX, startY = e.clientY;
      var orig = { x: p.x, y: p.y, w: p.w, h: p.h };

      shield.classList.add('on');
      el.classList.add('dragging');
      shield.setPointerCapture(e.pointerId);

      function onMove(ev) {
        var dx = (ev.clientX - startX) / rect.width;
        var dy = (ev.clientY - startY) / rect.height;

        if (mode === 'move') {
          // Kept fully on the canvas, so a tool can never be dragged out of
          // sight mid-lesson.
          p.x = clamp(orig.x + dx, 0, 1 - orig.w);
          p.y = clamp(orig.y + dy, 0, 1 - orig.h);
        } else {
          p.w = clamp(orig.w + dx, MIN_W, 1 - orig.x);
          p.h = clamp(orig.h + dy, MIN_H, 1 - orig.y);
        }
        delete p.prev;      // any manual change ends "maximised" state
        place(el, p);
      }

      function onUp(ev) {
        shield.releasePointerCapture(ev.pointerId);
        shield.removeEventListener('pointermove', onMove);
        shield.removeEventListener('pointerup', onUp);
        shield.removeEventListener('pointercancel', onUp);
        shield.classList.remove('on');
        el.classList.remove('dragging');
        save();
      }

      shield.addEventListener('pointermove', onMove);
      shield.addEventListener('pointerup', onUp);
      shield.addEventListener('pointercancel', onUp);
    }

    /* ---------------- picker ---------------- */
    function openPicker() {
      grid.innerHTML = '';
      TOOLS.forEach(function (tool) {
        var b = document.createElement('button');
        b.type = 'button';
        var on = panes.some(function (p) { return p.key === tool.key; });
        b.textContent = on ? tool.label + ' ✓' : tool.label;
        b.disabled = on || panes.length >= MAX_PANES;
        b.addEventListener('click', function () {
          if (b.disabled) return;
          var r = defaultRect(panes.length);
          panes.push({ key: tool.key, x: r.x, y: r.y, w: r.w, h: r.h });
          save();
          render();
          closePicker();
        });
        grid.appendChild(b);
      });
      backdrop.classList.add('open');
    }
    function closePicker() { backdrop.classList.remove('open'); }

    document.getElementById('addBtn').addEventListener('click', openPicker);
    backdrop.addEventListener('click', function (e) { if (e.target === backdrop) closePicker(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && backdrop.classList.contains('open')) closePicker();
    });

    document.getElementById('tidyBtn').addEventListener('click', function () {
      panes.forEach(function (p, i) {
        var r = defaultRect(i);
        p.x = r.x; p.y = r.y; p.w = r.w; p.h = r.h;
        delete p.prev;
      });
      save();
      render();
    });

    document.getElementById('clearBtn').addEventListener('click', function () {
      if (panes.length && !confirm('Remove all tools from the board?')) return;
      panes = [];
      save();
      render();
    });

    document.getElementById('fsBtn').addEventListener('click', function () {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    });

    /* ---------------- pop out into its own window ----------------
       A board stuck in a tab is invisible the moment you switch tabs to
       show the class something else. In its own window it stays up while
       the original tab goes off and does whatever it likes.

       The opener tears its own panes down while popped out: two live
       copies would mean two microphone streams and two sets of alarms. */
    var popped = /[?&]window=1\b/.test(location.search);
    var popWin = null;
    var detached = document.getElementById('detached');

    if (popped) document.body.classList.add('tk-popped');

    function setDetached(on) {
      detached.classList.toggle('on', on);
      canvas.style.display = on ? 'none' : '';
      if (on) {
        // Removing the panes stops their tools; `panes` itself is kept so
        // the same board comes straight back.
        Array.prototype.slice.call(canvas.querySelectorAll('.pane')).forEach(function (el) { el.remove(); });
      } else {
        panes = load();     // pick up anything rearranged in the other window
        render();
      }
    }

    document.getElementById('popBtn').addEventListener('click', function () {
      var url = location.pathname + '?window=1';
      var w = Math.min(screen.availWidth, 1440);
      var h = Math.min(screen.availHeight, 900);
      popWin = window.open(url, 'tk-lesson-board',
        'width=' + w + ',height=' + h + ',left=0,top=0');

      if (!popWin) {
        // Never alert(): a blocking dialog freezes the page mid-lesson and
        // reads as a crash. Same reason toast.js exists.
        if (window.TKToast) {
          TKToast.show('Your browser blocked the new window — allow pop-ups for this site, then try again.');
        }
        return;
      }
      setDetached(true);

      // If they just close that window, take the board back rather than
      // leaving this tab showing a dead notice.
      var poll = setInterval(function () {
        if (popWin && popWin.closed) {
          clearInterval(poll);
          popWin = null;
          setDetached(false);
        }
      }, 800);
    });

    document.getElementById('reclaimBtn').addEventListener('click', function () {
      if (popWin && !popWin.closed) popWin.close();
      popWin = null;
      setDetached(false);
    });

    // Panes are sized in percentages, so every tool needs rescaling when the
    // window (or the projector) changes size.
    window.addEventListener('resize', function () {
      Array.prototype.slice.call(canvas.querySelectorAll('.pane')).forEach(rescale);
    });

    render();
  })();
  </script>
</body>
</html>

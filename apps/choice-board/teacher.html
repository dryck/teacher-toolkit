<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choice Board — Teacher Dashboard</title>
  <link rel="stylesheet" href="../shell/theme.css">
  <link rel="stylesheet" href="../shell/navbar.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--tk-bg-gradient);
      min-height: 100vh;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }
    h1 {
      text-align: center;
      color: #fff;
      font-size: 1.8rem;
      margin-bottom: 24px;
    }
    .card {
      background: var(--tk-surface);
      border-radius: var(--tk-radius);
      box-shadow: var(--tk-shadow);
      padding: 24px;
      margin-bottom: 20px;
    }
    .card h2 {
      font-size: 1.2rem;
      color: var(--tk-text);
      margin-bottom: 16px;
    }

    /* Board editor */
    label { font-weight: 600; color: var(--tk-text); display: block; margin-bottom: 6px; font-size: 0.9rem; }
    #titleInput {
      width: 100%;
      font-size: 1.1rem;
      padding: 10px 14px;
      border: 2px solid #ddd;
      border-radius: 10px;
      margin-bottom: 18px;
    }

    .mode-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding: 12px 14px;
      background: #f7f7fb;
      border-radius: 10px;
    }
    .mode-row label { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 0.95rem; }
    .mode-row input[type="number"] {
      width: 70px;
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-weight: 700;
      text-align: center;
    }

    .grid-editor {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .cell-editor {
      border: 2px solid #eee;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #fafafa;
    }
    .cell-editor.filled { border-color: var(--tk-primary); background: #f4f3ff; }
    .cell-editor select {
      font-size: 1.3rem;
      padding: 4px;
      border: 1px solid #ddd;
      border-radius: 8px;
      text-align: center;
    }
    .cell-editor input[type="text"] {
      font-size: 0.85rem;
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    .cell-editor textarea {
      font-size: 0.8rem;
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
      resize: vertical;
      min-height: 44px;
      font-family: inherit;
    }
    .cell-num { font-size: 0.7rem; color: var(--tk-text-muted); font-weight: 700; }

    .btn-row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .btn {
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      color: #fff;
      background: var(--tk-primary);
    }
    .btn.secondary { background: #e0e7ff; color: #3730a3; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Join card */
    .join-card {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .join-card img { width: 140px; height: 140px; border-radius: 8px; }
    .join-info { text-align: center; }
    .join-info .code {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--tk-primary-dark);
    }
    .join-info .url {
      font-size: 0.95rem;
      color: var(--tk-text-muted);
      word-break: break-all;
      margin-top: 4px;
    }
    .join-info button {
      margin-top: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }

    /* Progress view */
    .student-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .student-row:last-child { border-bottom: none; }
    .student-row .nickname { width: 140px; flex-shrink: 0; font-weight: 700; color: var(--tk-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .student-row .bar {
      flex: 1;
      font-family: 'Courier New', monospace;
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: var(--tk-primary-dark);
    }
    .student-row .frac { width: 70px; text-align: right; font-weight: 700; color: var(--tk-text); flex-shrink: 0; }
    #noStudents { color: var(--tk-text-muted); text-align: center; padding: 10px 0; }

    .stat-row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; }
    .stat-box {
      flex: 1;
      min-width: 200px;
      background: #f7f7fb;
      border-radius: 10px;
      padding: 14px 16px;
    }
    .stat-box .stat-label { font-size: 0.8rem; color: var(--tk-text-muted); font-weight: 700; text-transform: uppercase; }
    .stat-box .stat-value { font-size: 1rem; font-weight: 700; color: var(--tk-text); margin-top: 4px; }

    #editorSaved { text-align: center; font-size: 0.85rem; color: #16a34a; min-height: 1.2em; margin-top: 10px; }
  </style>
</head>
<body>
  <main>
    <h1>🧩 Choice Board — Teacher Dashboard</h1>

    <div class="card">
      <h2>Board editor</h2>
      <label for="titleInput">Board title</label>
      <input type="text" id="titleInput" placeholder="e.g. Water Cycle">

      <div class="mode-row">
        <label><input type="checkbox" id="mustDoToggle"> Must do / Can do mode</label>
        <label id="minRequiredWrap" style="display:none">Minimum tasks required
          <input type="number" id="minRequiredInput" min="1" max="9" value="3">
        </label>
      </div>

      <div class="grid-editor" id="gridEditor"></div>

      <div class="btn-row">
        <button class="btn" id="generateBtn">🔗 Generate Code</button>
        <button class="btn secondary" id="saveBtn" style="display:none">💾 Save Changes</button>
      </div>
      <div id="editorSaved"></div>
    </div>

    <div class="card" id="joinCard" style="display:none">
      <h2>Students join at</h2>
      <div class="join-card">
        <img id="qrImg" alt="QR code to join">
        <div class="join-info">
          <div class="code" id="sessionCode"></div>
          <div class="url" id="joinUrl"></div>
          <button id="copyBtn">Copy link</button>
        </div>
      </div>
    </div>

    <div class="card" id="progressCard" style="display:none">
      <h2>Live progress</h2>
      <div id="studentRows"></div>
      <div id="noStudents">No students have joined yet.</div>
      <div class="stat-row">
        <div class="stat-box">
          <div class="stat-label">Most popular task</div>
          <div class="stat-value" id="mostPopular">No data yet</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Least chosen task</div>
          <div class="stat-value" id="leastChosen">No data yet</div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
  <script src="../shell/firebase-config.js"></script>
  <script src="choice-board.js"></script>
  <script>
    const CELL_COUNT = TKChoiceBoard.CELL_COUNT;
    let sessionId = (new URLSearchParams(location.search).get('session') || '').toUpperCase();

    // Without a timeout, a bad connection/config leaves a write pending
    // forever with no feedback at all — same failure mode fixed on the
    // student page. `onTimeout` and the promise's own then/catch are
    // mutually exclusive via the `settled` flag.
    function withTimeout(promise, onSuccess, onFailure, ms = 8000) {
      let settled = false;
      const timeoutId = setTimeout(() => {
        if (settled) return;
        settled = true;
        onFailure(new Error('timeout'));
      }, ms);
      promise.then(result => {
        if (settled) return;
        settled = true;
        clearTimeout(timeoutId);
        onSuccess(result);
      }).catch(err => {
        if (settled) return;
        settled = true;
        clearTimeout(timeoutId);
        onFailure(err);
      });
    }

    const titleInput = document.getElementById('titleInput');
    const mustDoToggle = document.getElementById('mustDoToggle');
    const minRequiredWrap = document.getElementById('minRequiredWrap');
    const minRequiredInput = document.getElementById('minRequiredInput');
    const gridEditor = document.getElementById('gridEditor');
    const generateBtn = document.getElementById('generateBtn');
    const saveBtn = document.getElementById('saveBtn');
    const editorSaved = document.getElementById('editorSaved');
    const joinCard = document.getElementById('joinCard');
    const progressCard = document.getElementById('progressCard');

    mustDoToggle.onchange = () => {
      minRequiredWrap.style.display = mustDoToggle.checked ? 'inline-flex' : 'none';
    };

    // Build the 9 cell editors.
    const cellEditors = [];
    for (let i = 0; i < CELL_COUNT; i++) {
      const wrap = document.createElement('div');
      wrap.className = 'cell-editor';

      const num = document.createElement('div');
      num.className = 'cell-num';
      num.textContent = 'Cell ' + (i + 1);

      const iconSelect = document.createElement('select');
      const noneOpt = document.createElement('option');
      noneOpt.value = '';
      noneOpt.textContent = '(empty)';
      iconSelect.appendChild(noneOpt);
      TKChoiceBoard.ICONS.forEach(icon => {
        const opt = document.createElement('option');
        opt.value = icon.emoji;
        opt.textContent = icon.emoji + ' ' + icon.label;
        iconSelect.appendChild(opt);
      });

      const titleField = document.createElement('input');
      titleField.type = 'text';
      titleField.placeholder = 'Short title';

      const descField = document.createElement('textarea');
      descField.placeholder = 'Description';

      function syncFilledState() {
        wrap.classList.toggle('filled', !!iconSelect.value);
      }
      iconSelect.onchange = syncFilledState;

      wrap.append(num, iconSelect, titleField, descField);
      gridEditor.appendChild(wrap);
      cellEditors.push({ iconSelect, titleField, descField });
    }

    function collectBoardConfig() {
      const cells = cellEditors.map(ce => {
        if (!ce.iconSelect.value) return null;
        return {
          icon: ce.iconSelect.value,
          title: ce.titleField.value.trim(),
          description: ce.descField.value.trim()
        };
      });
      return {
        title: titleInput.value.trim() || 'Choice Board',
        cells,
        mustDoMode: mustDoToggle.checked,
        minRequired: mustDoToggle.checked ? (parseInt(minRequiredInput.value, 10) || 1) : 0
      };
    }

    function applyBoardConfig(config) {
      titleInput.value = config.title || '';
      mustDoToggle.checked = !!config.mustDoMode;
      minRequiredWrap.style.display = mustDoToggle.checked ? 'inline-flex' : 'none';
      minRequiredInput.value = config.minRequired || 3;
      (config.cells || TKChoiceBoard.emptyCells()).forEach((cell, i) => {
        const ce = cellEditors[i];
        if (!ce) return;
        if (cell) {
          ce.iconSelect.value = cell.icon || '';
          ce.titleField.value = cell.title || '';
          ce.descField.value = cell.description || '';
        } else {
          ce.iconSelect.value = '';
          ce.titleField.value = '';
          ce.descField.value = '';
        }
        ce.iconSelect.dispatchEvent(new Event('change'));
      });
    }

    function showFlash(msg) {
      editorSaved.textContent = msg;
      setTimeout(() => { editorSaved.textContent = ''; }, 2000);
    }

    function showJoinAndProgress(id) {
      const joinUrl = location.origin + location.pathname.replace('teacher.html', 'index.html') + '?session=' + id;
      document.getElementById('sessionCode').textContent = id;
      document.getElementById('joinUrl').textContent = joinUrl;
      // QR image rendered via a public QR-generation service (api.qrserver.com) --
      // the join URL contains only a random session code, no student data.
      document.getElementById('qrImg').src = 'https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=' + encodeURIComponent(joinUrl);
      joinCard.style.display = 'block';
      progressCard.style.display = 'block';
      saveBtn.style.display = 'inline-block';
      generateBtn.textContent = '🔗 Generate New Code';
      startProgressListener(id);
    }

    document.getElementById('copyBtn').onclick = () => {
      const joinUrl = document.getElementById('joinUrl').textContent;
      navigator.clipboard.writeText(joinUrl).then(() => {
        const btn = document.getElementById('copyBtn');
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = original; }, 1500);
      });
    };

    generateBtn.onclick = () => {
      const config = collectBoardConfig();
      const newId = TKChoiceBoard.randomSessionCode();
      generateBtn.disabled = true;
      withTimeout(
        TKChoiceBoard.boardDocRef(newId).set(config),
        () => {
          generateBtn.disabled = false;
          sessionId = newId;
          const url = new URL(location.href);
          url.searchParams.set('session', sessionId);
          history.replaceState(null, '', url);
          showJoinAndProgress(sessionId);
          showFlash('Board created!');
        },
        err => {
          generateBtn.disabled = false;
          console.error(err);
          alert('Could not create the board — check your connection and try again.');
        }
      );
    };

    saveBtn.onclick = () => {
      if (!sessionId) return;
      const config = collectBoardConfig();
      saveBtn.disabled = true;
      withTimeout(
        TKChoiceBoard.boardDocRef(sessionId).set(config),
        () => {
          saveBtn.disabled = false;
          showFlash('Saved!');
        },
        err => {
          saveBtn.disabled = false;
          console.error(err);
          alert('Could not save changes — check your connection and try again.');
        }
      );
    };

    let unsubscribeProgress = null;
    function startProgressListener(id) {
      if (unsubscribeProgress) unsubscribeProgress();
      unsubscribeProgress = TKChoiceBoard.progressCollRef(id).onSnapshot(snap => {
        const students = [];
        snap.forEach(doc => students.push(doc.data()));
        renderProgress(students);
      }, err => console.error(err));
    }

    function renderProgress(students) {
      const rowsEl = document.getElementById('studentRows');
      const noStudentsEl = document.getElementById('noStudents');
      rowsEl.innerHTML = '';
      if (!students.length) {
        noStudentsEl.style.display = 'block';
      } else {
        noStudentsEl.style.display = 'none';
        students.forEach(s => {
          const completed = s.completed || TKChoiceBoard.emptyCompleted();
          const n = TKChoiceBoard.countCompleted(completed);
          const bar = completed.map(done => done ? '■' : '□').join('');
          const row = document.createElement('div');
          row.className = 'student-row';
          row.innerHTML = `
            <div class="nickname">${escapeHtml(s.nickname || 'Student')}</div>
            <div class="bar">${bar}</div>
            <div class="frac">${n}/${CELL_COUNT}</div>
          `;
          rowsEl.appendChild(row);
        });
      }

      // Most/least popular task, based on how many students completed each
      // cell index. Only cells that are actually filled in the current
      // board config are eligible.
      const config = collectBoardConfig();
      const counts = new Array(CELL_COUNT).fill(0);
      students.forEach(s => {
        (s.completed || []).forEach((done, i) => { if (done) counts[i]++; });
      });
      const eligible = counts.map((c, i) => ({ c, i })).filter(x => config.cells[i]);
      const mostEl = document.getElementById('mostPopular');
      const leastEl = document.getElementById('leastChosen');
      if (!eligible.length || !students.length) {
        mostEl.textContent = 'No data yet';
        leastEl.textContent = 'No data yet';
      } else {
        const most = eligible.reduce((a, b) => (b.c > a.c ? b : a));
        const least = eligible.reduce((a, b) => (b.c < a.c ? b : a));
        const cellLabel = (i) => {
          const cell = config.cells[i];
          return cell.icon + ' ' + (cell.title || 'Untitled') + ' (' + counts[i] + ')';
        };
        mostEl.textContent = cellLabel(most.i);
        leastEl.textContent = cellLabel(least.i);
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // If a session code is already in the URL, load its existing board
    // config into the editor and jump straight to the join + progress view.
    if (sessionId) {
      TKChoiceBoard.boardDocRef(sessionId).get().then(doc => {
        if (doc.exists) {
          applyBoardConfig(doc.data());
          showJoinAndProgress(sessionId);
        } else {
          // Stale/unknown code in the URL — fall back to a blank editor.
          sessionId = '';
          const url = new URL(location.href);
          url.searchParams.delete('session');
          history.replaceState(null, '', url);
        }
      }).catch(err => console.error(err));
    } else {
      applyBoardConfig({ title: '', cells: TKChoiceBoard.emptyCells(), mustDoMode: false, minRequired: 3 });
    }
  </script>
  <script>window.TK_CURRENT = 'choice-board';</script>
  <script src="../shell/navbar.js"></script>
</body>
</html>

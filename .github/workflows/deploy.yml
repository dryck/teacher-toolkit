name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  # Needed by the build job's configure-pages/upload-pages-artifact steps as
  # well as by deploy, so this stays workflow-wide. Narrowing it to the deploy
  # job alone is worth doing, but not blind -- it breaks the deploy if
  # configure-pages turns out to need it, and this workflow cannot be tested
  # locally.
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # The Firestore rules are the only thing in this repo whose failure reaches
  # beyond one lesson, so they gate the deploy alongside the smoke tests.
  # Separate job: it needs a JVM for the emulator but no browser or build.
  rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # firebase-tools 15 requires Java 21 or newer.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Firestore rules tests
        run: npm run test:rules

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Smoke tests run against the built dist/, and the deploy job needs
      # this job to succeed — so a page that throws on load can't reach
      # production the way the random-picker crash previously did.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test every page
        run: npm test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, rules]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
